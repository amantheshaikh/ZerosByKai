<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1500" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bangers&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1500px;
      height: 500px;
      overflow: hidden;
    }

    .card {
      width: 1500px;
      height: 500px;
      background: linear-gradient(135deg, #fde047 0%, #facc15 45%, #f59e0b 100%);
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Dot texture */
    .dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(0, 0, 0, 0.12) 1.5px, transparent 1.5px);
      background-size: 14px 14px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── LEFT content ────────────────────────────── */
    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 100px 60px 100px 360px;
      position: relative;
      z-index: 1;
      gap: 16px;
      height: 500px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .brand-name {
      font-family: 'Bangers', cursive;
      font-size: 52px;
      letter-spacing: 5px;
      color: #000;
      line-height: 1;
    }

    .pill {
      display: inline-block;
      background: #fff;
      border: 3px solid #000;
      font-family: 'Courier Prime', monospace;
      font-size: 21px;
      font-weight: 700;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 7px 16px;
      transform: rotate(-1.5deg);
      line-height: 1;
    }

    .title {
      font-family: 'Bangers', cursive;
      font-size: 90px;
      line-height: 0.88;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .title-accent {
      color: #be123c;
    }

    .quote-panel {
      width: 700px;
      background: #fff;
      border: 3px solid #000;
      border-left: 8px solid #000;
      font-family: 'Courier Prime', monospace;
      font-size: 28px;
      font-style: italic;
      color: #000;
      padding: 14px 20px;
      line-height: 1.4;
    }

    .q-hi {
      background: #facc15;
      color: #000;
      font-weight: 700;
      font-style: normal;
      padding: 1px 7px;
    }

    .q-cta {
      background: #be123c;
      color: #fff;
      font-weight: 700;
      font-style: normal;
      padding: 1px 7px;
    }

    /* ── RIGHT: Kai image — 350px wide ──────────── */
    .right {
      flex-shrink: 0;
      width: 350px;
      height: 400px;
      position: relative;
      z-index: 1;
      overflow: visible;
      margin-right: 150px;
      /* let frame breathe, card clips the rest */
    }

    /* Image frame — scaled so portrait fits fully within 400px height.
       Frame overhead: border 4px×2 + padding 8px×2 = 24px.
       Inner image height: (275 - 24) × (675/450) = 376px → frame = 400px ✓ */
    .kai-frame {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) rotate(2deg);
      width: 275px;
      background: linear-gradient(135deg, #fef08a, #fef9c3);
      border: 4px solid #000;
      padding: 8px;
      box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.3);
    }

    /* Inner image border — mirrors border-4 border-black from HeroSection */
    .kai-frame img {
      width: 100%;
      height: auto;
      display: block;
      border: 4px solid #000;
    }

    /* MEET KAI badge — top-left, outside frame, relative to .right */
    .proof-meet {
      position: absolute;
      top: 20px;
      left: -2px;
      background: #000;
      border: 3px solid #facc15;
      padding: 8px 14px;
      transform: rotate(-6deg);
      z-index: 3;
    }

    .proof-meet .pm-title {
      font-family: 'Bangers', cursive;
      font-size: 18px;
      color: #facc15;
      letter-spacing: 2px;
      line-height: 1.1;
    }

    .proof-meet .pm-sub {
      font-family: 'Courier Prime', monospace;
      font-size: 12px;
      font-weight: 700;
      color: rgba(253, 230, 138, 0.85);
    }

    /* Trophy badge — bottom-right, relative to .right */
    .proof-trophy {
      position: absolute;
      bottom: 26px;
      right: 2px;
      background: #be123c;
      border: 3px solid #000;
      padding: 8px 12px;
      transform: rotate(3deg);
      z-index: 3;
      text-align: center;
    }

    .proof-trophy p {
      font-family: 'Bangers', cursive;
      font-size: 15px;
      color: #fff;
      letter-spacing: 1px;
      line-height: 1.2;
    }

    .proof-trophy span {
      color: #fde047;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="dots"></div>

    <!-- Left: Brand + Content -->
    <div class="left">
      <div class="brand-row">
        <img class="logo" src="data:image/png;base64,{{FAVICON_BASE64}}" alt="" />
        <span class="brand-name">ZEROS BY KAI</span>
      </div>

      <div class="pill">⚡ 10 Fresh Ideas Every Monday</div>

      <div class="title">
        REAL PROBLEMS.<br />
        <span class="title-accent">REAL STARTUP IDEAS.</span>
      </div>

      <div class="quote-panel">
        "In a world where <span class="q-hi">0 → 1</span> has become super easy, find the <span class="q-cta">right
          ZERO.</span>"
      </div>
    </div>

    <!-- Right: Kai Image, 350px column -->
    <div class="right">
      <!-- Badges positioned relative to .right, outside the image frame -->
      <div class="proof-meet">
        <div class="pm-title">👋 MEET KAI</div>
        <div class="pm-sub">Your Idea Dealer</div>
      </div>
      <div class="proof-trophy">
        <p>🏆 WORLD'S BEST<br /><span>PROBLEM HUNTER</span></p>
      </div>

      <!-- Image at natural proportions — top-anchored, bottom clips ~4px -->
      <div class="kai-frame">
        <img src="data:image/jpeg;base64,{{KAI_IMAGE_BASE64}}" alt="Kai" />
      </div>
    </div>

  </div>
</body>

</html>
