name: Weekly Digest Email

on:
  schedule:
    # Runs at 14:15 UTC every Monday (9:15 AM EST / 6:15 AM PST)
    # Using 15 past the hour avoids GitHub's top-of-the-hour heavy usage queues.
    - cron: '15 14 * * 1'
  workflow_dispatch: # Allows manual triggering from GitHub UI for testing

jobs:
  send-digest:
    name: Send Weekly Digest
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: ./backend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Weekly Digest Script
        # Only pass --scheduled flag if triggered by cron schedule.
        # This allows manual workflow_dispatch to bypass the "Monday Only" check.
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            node src/jobs/weekly.js --scheduled
          else
            echo "Manual trigger detected: Running immediately (bypassing Monday check)..."
            node src/jobs/weekly.js
          fi
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_WEEKLY_DIGEST_TEMPLATE_ID: ${{ secrets.BREVO_WEEKLY_DIGEST_TEMPLATE_ID }}
          EMAIL_TOKEN_SECRET: ${{ secrets.EMAIL_TOKEN_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Generate X Content (images + CSV)
        run: node src/jobs/generate_x_content.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

      - name: Commit Generated X Posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add x_posts/
          if git diff --staged --quiet; then
            echo "No changes in X posts to commit."
          else
            git commit -m "chore: auto-generate X posts for the week [skip ci]"
            git push
          fi

      - name: Upload X Posts as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-posts-${{ github.run_id }}
          path: backend/x_posts/
          retention-days: 90
